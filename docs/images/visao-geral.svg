<g font-family="Segoe UI,Arial,sans-serif"><text x="65" y="62" fill="#94a3b8" font-size="13" letter-spacing="2">PORTFÓLIO · HIAGO CAVALHEIRO</text>
<text x="65" y="103" fill="#f8fafc" font-size="34" font-weight="700">Inventário de Ativos de TI</text>
<text x="65" y="138" fill="#cbd5e1" font-size="18">Coleta de hardware e registro local para computadores Windows</text><rect x="40" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="64" y="212" fill="#38bdf8" font-size="13" font-weight="700">01 · COLETAR</text><text x="64" y="250" fill="#f8fafc" font-size="23" font-weight="600">Windows + PowerShell</text><text x="64" y="289" fill="#cbd5e1" font-size="17">Fabricante, modelo e serial</text><text x="64" y="317" fill="#cbd5e1" font-size="17">CPU, memória e armazenamento</text><path d="M 390 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#38bdf8" stroke-width="2" fill="none"/><rect x="430" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="454" y="212" fill="#38bdf8" font-size="13" font-weight="700">02 · ASSOCIAR</text><text x="454" y="250" fill="#f8fafc" font-size="23" font-weight="600">Python + Tkinter</text><text x="454" y="289" fill="#cbd5e1" font-size="17">Seleção do usuário</text><text x="454" y="317" fill="#cbd5e1" font-size="17">Leitura da lista com Pandas</text><path d="M 780 267 h 27 m -7 -7 l 7 7 -7 7" stroke="#38bdf8" stroke-width="2" fill="none"/><rect x="820" y="180" width="340" height="174" rx="14" fill="#1e293b" stroke="#334155"/><text x="844" y="212" fill="#38bdf8" font-size="13" font-weight="700">03 · REGISTRAR</text><text x="844" y="250" fill="#f8fafc" font-size="23" font-weight="600">SQLite</text><text x="844" y="289" fill="#cbd5e1" font-size="17">Inventário por serial</text><text x="844" y="317" fill="#cbd5e1" font-size="17">Executável com PyInstaller</text><text x="40" y="399" fill="#38bdf8" font-size="15" letter-spacing="1">PYTHON   /   TKINTER   /   POWERSHELL   /   SQLITE</text><text x="40" y="432" fill="#94a3b8" font-size="13">DIAGRAMA FUNCIONAL · Baseado nos componentes presentes no código</text></g></svg>
